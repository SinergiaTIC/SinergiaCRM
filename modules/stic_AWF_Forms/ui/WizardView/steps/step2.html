 <!-- Main Panel -->
<main x-data="WizardStep2.mainStep2xData();">
  <div x-data="WizardStep2.addDataBlockModulexData();">
    <!-- No Data Block Configured -->
    <div x-show="data_blocks.length === 0" class="text-center p-3 border rounded bg-light">
      <h2 class="mb-4" x-text="utils.translate('LBL_WIZARD_TITLE_STEP2_START')"></h2>
      <div class="d-flex justify-content-center gap-3 mt-3">
        <!-- Button: Add Datablock -->
        <button type="button" class="btn w-auto" @click="creatingDataBlock=true;" :title="utils.translate('LBL_DATABLOCK_ADD_TITLE')">
          <i class="suitepicon suitepicon-module-basic me-2"></i>
          <span x-text="utils.translate('LBL_DATABLOCK_ADD')"></span>
        </button>
        <!-- Button: Add Unlinked Datablock -->
        <button type="button" class="btn w-auto" @click="creatingUnlinkedDataBlock=true;" :title="utils.translate('LBL_DATABLOCK_ADD_UNLINKED_TITLE')">
          <i class="suitepicon suitepicon-module-surveys me-2"></i>
          <span x-text="utils.translate('LBL_DATABLOCK_ADD_UNLINKED')"></span>
        </button>
      </div>
    </div>

    <!-- Data Blocks -->
    <div x-show="data_blocks.length > 0" x-data="WizardStep2.generalDatablocksxData();">
      <h2 class="mb-2" x-text="utils.translate('LBL_DATABLOCKS')"></h2>
      <!-- Main Content -->

      <!-- DataBlocks -->
      <div class="work-area-container" style="position: relative; padding-bottom: 20px;">
        <template x-for="item in orderedDataBlocks" :key="item.id">
          <!-- DataBlock -->
          <div :id="'dataBlock_' + item.id" class="card datablock mb-3 shadow-sm transition-all"
               :class="{
                  'has-errors': !item.isValid(), 
                  'child-block border-info': item.is_child,
                  'groupdatablock border-primary': item.isGroupHead(data_blocks)
               }" 
               :style="'margin-left: ' + (item.getDepth(data_blocks) * 2.75) + 'rem;'"
               x-data="{ showGroupSettings: false, ...WizardStep2.datablockxData(item) }">
            
            <!-- Integrated Group header (Rendered ONLY if item is a group head/subgroup) -->
            <template x-if="item.isGroupHead(data_blocks)">
              <!-- Group Header -->
              <div class="card-header border-bottom p-2">
                <!-- Group Info -->
                <div class="d-flex align-items-center justify-content-between">
                  <!-- Group Title -->
                  <div class="d-flex flex-column ">
                    <!-- Group Badge -->
                    <template x-if="item.group_root">
                      <span class="badge bg-transparent text-dark" style="margin-left:-10px; margin-top:-5px;font-weight: normal;" 
                            x-text="'📦 ' + item.getGroupTitle(data_blocks)"></span>
                    </template>

                    <!-- Optional and Repeatable Badges -->
                    <div class="d-flex justify-content-start">
                      <!-- Optional Badge -->
                      <span class="badge bg-info me-2" x-show="item.is_optional" x-text="utils.translate('LBL_DATABLOCK_GROUP_OPTIONAL')"></span>
                      <!-- Repeatable Badge -->
                      <span class="badge bg-primary" x-show="item.is_repeatable" x-text="utils.translate('LBL_DATABLOCK_GROUP_REPEATABLE')"></span>
                    </div>

                    <!-- Group title -->
                    <div class="d-flex">
                        <span class="h3 m-2" :title="utils.translate('LBL_DATABLOCK_GROUP')">📦</span>
                        <h3 class="mb-0 text-primary fw-bold" :id="`groupDataBlockTitleEdit-${item.id}`" data-model="item.custom_group_title" data-reload="reloadGroupTitle(item)" x-init="sticControls.editableText($el);"></h3>
                    </div>
                  </div>

                  <!-- Options -->
                  <div class="d-inline-flex align-items-center gap-4">
                    <!-- Optional Switch -->
                    <template x-if="item.canBeOptional(data_blocks)">
                      <div class="form-check form-switch d-flex align-items-center mb-0">
                        <label class="form-check-label small me-2" :for="`groupOptSwitch_${item.id}`" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_GROUP_OPTIONAL')"></label>
                        <input class="form-check-input" type="checkbox" role="switch" :id="`groupOptSwitch_${item.id}`"
                              :checked="item.is_optional" :disabled="!item.canBeOptional(data_blocks)"
                              @change="toggleOptional(item, $el.checked, false)">
                      </div>
                    </template>

                    <!-- Repeatable Switch -->
                    <template x-if="item.canBeRepeatable(data_blocks)">
                      <div class="form-check form-switch d-flex align-items-center mb-0">
                        <label class="form-check-label small me-2" :for="`groupRepSwitch_${item.id}`" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_GROUP_REPEATABLE')"></label>
                        <input class="form-check-input" type="checkbox" role="switch" :id="`groupRepSwitch_${item.id}`"
                              :checked="item.is_repeatable" :disabled="!item.canBeRepeatable(data_blocks)"
                              @change="toggleRepeatable(item, $el.checked, false)">
                      </div>
                    </template>

                    <!-- Toggle Group Settings Panel -->
                    <button type="button" class="btn btn-sm btn-outline-primary ms-2" @click="showGroupSettings = !showGroupSettings"
                            :class="{'active': showGroupSettings}" :title="utils.translate('LBL_DATABLOCK_GROUP_CONFIGURE')">
                      <template x-if="!showGroupSettings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear" viewBox="0 0 16 16">
                          <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0"/>
                          <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z"/>
                        </svg>
                      </template>
                      <template x-if="showGroupSettings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
                          <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
                        </svg>
                      </template>
                    </button>
                  </div>
                </div>

                <!-- Group Settings Drawer -->
                <div x-show="showGroupSettings" x-transition class="mt-3 p-3 border rounded shadow-lg">
                  <!-- Group Settings -->
                  <div class="row g-3 align-items-center">

                    <!-- Text: Toggle Switch Custom Label -->
                    <div class="col-md-3" x-show="item.is_optional" x-init="utils.setInlineHelpQtip()">
                      <label :for="`groupToggleLabel_${item.id}`" class="form-label" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_INCLUDE_LABEL')"></label>
                      <i class="inline-help glyphicon glyphicon-info-sign"></i>
                      <div class="inline-help-content" style="display:none;" x-text="utils.translate('LBL_DATABLOCK_INCLUDE_LABEL_DESC')"></div>
                      <input type="text" :id="`groupToggleLabel_${item.id}`" class="form-control form-control-sm" x-model="item.toggle_label" 
                             :placeholder="utils.translate('LBL_DATABLOCK_INCLUDE_LABEL_DEFAULT') + ' ' + (item.group_title || item.text)">
                    </div>

                    <!-- Max Instances Limit -->
                    <div class="col-md-1" x-show="item.is_repeatable" x-init="utils.setInlineHelpQtip()">
                      <label :for="`groupMaxInstances_${item.id}`" class="form-label" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_MAX_REPETITIONS')"></label>
                      <i class="inline-help glyphicon glyphicon-info-sign"></i>
                      <div class="inline-help-content" style="display:none;" x-text="utils.translate('LBL_DATABLOCK_MAX_REPETITIONS_DESC')"></div>
                      <input type="number" :id="`groupMaxInstances_${item.id}`" min="2" placeholder="∞" class="form-control form-control-sm" 
                             x-model.number="item.max_instances" @input="item.sanitizeRepeatableLimits()" @blur="item.sanitizeRepeatableLimits()">
                    </div>

                    <!-- Text: Add Button Custom Label -->
                    <div class="col-md-3" x-show="item.is_repeatable" x-init="utils.setInlineHelpQtip()">
                      <label :for="`groupAddButton_${item.id}`" class="form-label" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_ADD_LABEL')"></label>
                      <i class="inline-help glyphicon glyphicon-info-sign"></i>
                      <div class="inline-help-content" style="display:none;" x-text="utils.translate('LBL_DATABLOCK_ADD_LABEL_DESC')"></div>
                      <input type="text" :id="`groupAddButton_${item.id}`" class="form-control form-control-sm" x-model="item.add_button_label" 
                             :placeholder="utils.translate('LBL_DATABLOCK_ADD_LABEL_DEFAULT')">
                    </div>

                    <!-- Text: Remove Button Custom Label -->
                    <div class="col-md-2" x-show="item.is_repeatable" x-init="utils.setInlineHelpQtip()">
                      <label :for="`groupRemoveButton_${item.id}`" class="form-label" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_REMOVE_LABEL')"></label>
                      <i class="inline-help glyphicon glyphicon-info-sign"></i>
                      <div class="inline-help-content" style="display:none;" x-text="utils.translate('LBL_DATABLOCK_REMOVE_LABEL_DESC')"></div>
                      <input type="text" :id="`groupRemoveButton_${item.id}`" class="form-control form-control-sm" x-model="item.remove_button_label" 
                             :placeholder="utils.translate('LBL_DATABLOCK_REMOVE_LABEL_DEFAULT')">
                    </div>

                    <!-- Add DataBlock to Group -->
                    <div class="col-md-3" x-show="item.getAvailableCandidateChildren(data_blocks).length>0" x-data="{ selectedCandidateId: '' }">
                      <label :for="`selectedCandidateId_${item.id}`" class="form-label" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_ADD_TO_GROUP')"></label>
                      <div class="input-group">
                        <select :id="`selectedCandidateId_${item.id}`" class="form-select" x-model="selectedCandidateId">
                          <option value=""></option>
                          <template x-for="candidate in item.getAvailableCandidateChildren(data_blocks)" :key="candidate.id">
                            <option :value="candidate.id" x-text="candidate.text + (candidate.module ? ' (' + candidate.getModuleText() + ')' : '')"></option>
                          </template>
                        </select>
                        <button type="button" class="btn" :title="utils.translate('LBL_DATABLOCK_ADD_TO_GROUP_TITLE')"
                                @click="formConfig.addChildToGroup(item.id, selectedCandidateId); selectedCandidateId = '';">
                          <span class="suitepicon suitepicon-action-plus"></span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <!-- Standard DataBlock header -->
            <div class="card-header pb-1 pe-0">
              <!-- Description / Options -->
              <div class="d-flex justify-content-between align-items-center mb-0">
                <!-- Group & Description -->
                <div class="d-flex flex-column">
                  <!-- Group Badge & Remove Button -->
                    <div class="d-flex">
                      <!-- Group Badge -->
                      <template x-if="item.group_root && !item.isGroupHead(data_blocks)">
                          <span class="badge bg-transparent text-dark" style="margin-left:-15px; margin-top:-5px;font-weight: normal;" 
                                x-text="'📦 ' + item.getGroupTitle(data_blocks)"></span>
                      </template>

                      <!-- Remove from Group Button -->
                      <template x-if="item.isManualGroupMemberOutsideTree(data_blocks)">
                        <button class="btn" :title="utils.translate('LBL_DATABLOCK_REMOVE_FROM_GROUP_TITLE')" style="margin-left:-10px; margin-top:-10px;"
                                @click="formConfig.removeChildFromGroup(item.id)">
                          <span class="suitepicon suitepicon-action-clear"></span>
                        </button>
                      </template>
                    </div>

                  <!-- Description -->
                  <div class="text-muted small" x-text="item.getTextDescription()"></div>
                </div>

                <!-- Options (hidden for group DataBlocks) -->
                <template x-if="!item.isGroupHead(data_blocks)">
                  <div class="d-flex align-items-center gap-4 me-3">
                    <!-- Optional Switch -->
                    <template x-if="item.canBeOptional(data_blocks)">
                      <div class="form-check form-switch d-flex align-items-center mb-0">
                        <label class="form-check-label small me-2" :for="'opt_switch_' + item.id" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_GROUP_OPTIONAL')"></label>
                        <input class="form-check-input" type="checkbox" role="switch" :id="'opt_switch_' + item.id" :checked="item.is_optional" 
                              @change="toggleOptional(item, $event.target.checked)">
                      </div>
                    </template>

                    <!-- Repeatable Switch -->
                    <template x-if="item.canBeRepeatable(data_blocks)">
                      <div class="form-check form-switch d-flex align-items-center mb-0">
                        <label class="form-check-label small me-2" :for="'rep_switch_' + item.id" x-text="utils.translateForFieldLabel('LBL_DATABLOCK_GROUP_REPEATABLE')"></label>
                        <input class="form-check-input" type="checkbox" role="switch" :id="'rep_switch_' + item.id" :checked="item.is_repeatable" 
                              @change="toggleRepeatable(item, $event.target.checked)">
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Title / Relationships / Buttons -->
              <div class="d-flex align-items-center">
                <!-- Title -->
                <h3 class="flex-grow-1 mb-0" :id="`dataBlockTitleEdit-${item.id}`" data-model="item.text" data-condition="item.editable_text" x-init="sticControls.editableText($el);"></h3>

                <!-- Relationships -->
                <div class="datablock-relationships mx-2">
                  <template x-for="(rel, index) in $store.dataBlockRelationships.usedDatablockRelationships(item.id)">
                    <div class="text-muted small" x-text="$store.dataBlockRelationships.getRelText(item.id, rel)"></div>
                  </template>
                </div>

                <!-- Buttons -->
                <div class="d-flex align-items-center ms-auto">
                  <!-- Delete Button -->
                  <template x-if="!item.required">
                    <button type="button" class="btn" @click="deleteDataBlock(item)" :title="utils.translate('LBL_BUTTON_DELETE')">
                      <span class="suitepicon suitepicon-action-delete"></span>
                    </button>
                  </template>

                  <!-- Chevron -->
                  <button class="btn btn-sm btn-link text-decoration-none" @click="toggleCollapse()">
                    <span class="awf-icon-toggle" :class="!isCollapsed ? 'open' : ''"></span>
                  </button>
                </div>
              </div>
            </div>

            <!-- DataBlock body -->
            <div class="card-body" x-show="!isCollapsed" x-transition>
              <!-- Alert message -->
              <template x-if="!item.isValid()">
                <div class="alert alert-danger p-2 mb-3 shadow-sm border-danger">
                  <div class="d-flex align-items-start">
                    <i class="suitepicon  suitepicon-template-issue text-danger me-2 mt-1"></i>
                    <div>
                      <strong class="text-danger" x-text="utils.translate('LBL_ERROR_DATABLOCK_IS_INVALID')"></strong>
                      <ul class="mb-0 ps-3 mt-1 text-danger small">
                        <template x-for="err in item.getValidationErrors()">
                          <li x-text="err"></li>
                        </template>
                      </ul>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Fields Definition -->
              <div :id="`dataBlockFields${item.id}`">
                <!-- Fields summary Tabs -->
                <div x-data="WizardStep2.fieldsSummaryxData(item);">
                  <!-- Tab Headers: Fields -->
                  <div class="stic-tabs">
                    <div class="stic-tab">
                      <input class="form-check-input" type="radio" :id="`dataBlockFieldsFormTab${item.id}`" x-model="fieldTabSelected" value="form"/>
                      <label class="form-label" :for="`dataBlockFieldsFormTab${item.id}`" x-text="utils.translate('LBL_FIELDS_FORM_TAB') + ' ('+item.fields.filter(f => f.isFieldInForm()).length+')'"></label>
                    </div>
                    <template x-if="item.module">
                      <div class="stic-tab">
                        <input class="form-check-input" type="radio" :id="`dataBlockFieldsHiddenTab${item.id}`" x-model="fieldTabSelected" value="fixed"/>
                        <label class="form-label" :for="`dataBlockFieldsHiddenTab${item.id}`" x-text="utils.translate('LBL_FIELDS_FIXED_TAB') + ' ('+item.fields.filter(f => !f.isFieldInForm()).length+')'"></label>
                      </div>
                    </template>
                  </div>
                  <!-- Tab Content: Fields-->
                  <div class="stic-tabcontent" x-data="WizardStep2.sortableListxData(item.fields)">
                    <!-- Description -->
                    <p x-text="summaryDescription"></p>
                    <!-- Buttons -->
                    <div class="mb-2">
                      <!-- Button: Add Field in Form -->
                      <template x-if="item.module && fieldTabSelected=='form'">
                        <button type="button" class="btn" @click="$store.fieldEditor.openCreate(item, 'form')" x-text="utils.translate('LBL_FIELD_FORM_ADD')"></button>
                      </template>
                      <!-- Button: Add Unlinked Field in Form -->
                      <template x-if="fieldTabSelected=='form'">
                        <button type="button" class="btn" @click="$store.fieldEditor.openCreate(item, 'unlinked')" x-text="utils.translate('LBL_FIELD_UNLINKED_ADD')"></button>
                      </template>
                      <!-- Button: Add Fixed Field -->
                      <template x-if="item.module && fieldTabSelected=='fixed'">
                        <button type="button" class="btn" @click="$store.fieldEditor.openCreate(item, 'fixed')" x-text="utils.translate('LBL_FIELD_FIXED_ADD')"></button>
                      </template>
                    </div>
                    <!-- Fields -->
                    <table class="table table-bordered table-striped" >
                      <thead>
                        <tr>
                          <th></th>
                          <th x-text="utils.translate(dataBlock.module?'LBL_FIELD':'LBL_FIELD_NAME')" x-show="canShowFieldColumn('text_original')"></th>
                          <th x-text="utils.translate('LBL_FIELD_LABEL')" x-show="canShowFieldColumn('label')"></th>
                          <th x-text="utils.translate('LBL_FIELD_TYPE_IN_FORM')" x-show="canShowFieldColumn('type_in_form')"></th>
                          <th x-text="utils.translate('LBL_FIELD_SUBTYPE_IN_FORM')" x-show="canShowFieldColumn('subtype_in_form')"></th>
                          <th x-text="utils.translate('LBL_FIELD_VALUE_TYPE')" x-show="canShowFieldColumn('value_type')"></th>
                          <th x-text="utils.translate('LBL_FIELD_VALUE')" x-show="canShowFieldColumn('value_text')"></th>
                          <th x-text="utils.translate('LBL_FIELD_REQUIRED_IN_FORM')" x-show="canShowFieldColumn('required_in_form')"></th>
                          <th x-text="utils.translate('LBL_FIELD_ACTIONS')" style="min-width: 160px;"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(field, index) in item.fields">
                          <template x-if="field && canShowField(field)">
                            <tr :class="{ 'table-danger': !field.isValid() }">
                              <td>
                                <!-- Ok tick -->
                                <template x-if="field.isValid()">
                                  <div class="d-flex align-items-center">
                                    <i class="suitepicon  suitepicon-action-confirm text-success me-2 mt-1" :title="utils.translate('LBL_OK_FIELD_IS_VALID')"></i>
                                  </div>
                                </template>
                                <!-- Alert message -->
                                <template x-if="!field.isValid()">
                                  <div class="d-flex align-items-center">
                                    <i class="suitepicon suitepicon-template-issue text-danger me-2 mt-1" :title="utils.translate('LBL_ERROR_FIELD_IS_INVALID')"></i>
                                    <ul class="m-0 p-0 text-danger small">
                                      <template x-for="err in field.getValidationErrors()">
                                        <li x-text="err"></li>
                                      </template>
                                    </ul>
                                    <button type="button" class="btn" :disabled="field.value_type == 'dataBlock'" 
                                            @click="$store.fieldEditor.openEdit(item, field);" 
                                            :title="utils.translate('LBL_BUTTON_EDIT')">
                                      <span class="suitepicon suitepicon-action-edit"></span>
                                    </button>
                                  </div>
                                </template>
                              </td>

                              <!-- Field -->
                              <td x-show="canShowFieldColumn('text_original')">
                                <i x-show="field?.type_field == 'unlinked'" x-text="'[ ' + field.text_original +' ]'"></i>
                                <div x-show="field?.type_field != 'unlinked'" x-text="field?.text_original"></div>
                                <div class="text-muted small" x-text="item.getFieldInputName(field)"></div>
                              </td>
                              <!-- Label & Validations -->
                              <td x-show="canShowFieldColumn('label')">
                                <div class="d-flex align-items-center justify-content-between">
                                  <!-- Label -->
                                  <div class="mb-0 me-3" :id="`dataBlockFieldLabel-${item.id}-${field.name}`" 
                                      data-model="field.label" x-init="sticControls.editableText($el);">
                                  </div>
                                  <!-- Validations Badge -->
                                  <template x-if="field.validations && field.validations.length > 0">
                                    <span class="badge rounded-pill bg-info text-dark" :title="getValidationsTooltip(field)">
                                      <i class="suitepicon suitepicon-module-accounts"></i>
                                      <span x-text="field.validations.length"></span>
                                    </span>
                                  </template>                              
                                </div>
                              </td>
                              <!-- Type in form -->
                              <td x-text="field?.type_in_formText" x-show="canShowFieldColumn('type_in_form')"></td>
                              <!-- Subtype in form -->
                              <td x-text="field?.subtype_in_formText" x-show="canShowFieldColumn('subtype_in_form')"></td>
                              <!-- Value type -->
                              <td x-text="field?.value_typeText" x-show="canShowFieldColumn('value_type')"></td>
                              <!-- Value -->
                              <td x-text="getfieldValueText(field)" x-show="canShowFieldColumn('value_text')"></td>
                              <!-- Required in form -->
                              <td x-show="canShowFieldColumn('required_in_form')">

                                  <input class="form-check-input form-switch" type="checkbox" role="switch" x-model="field.required_in_form"
