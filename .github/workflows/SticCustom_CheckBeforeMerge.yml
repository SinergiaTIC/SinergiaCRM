name: SticCustom - Commit previo en producción antes de mergear

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check_production_commit:
    name: Commit previo en producción
    # Solo repositorios de instancia (SCRM_*). El guard evita ejecutarse en SinergiaCRM.
    if: github.repository != 'SinergiaTIC/SinergiaCRM'
    runs-on: ubuntu-latest
    steps:
      - name: Commit manual previo en producción (plantilla 145)
        env:
          SEMAPHORE_URL: ${{ secrets.SEMAPHORE_URL }}
          SEMAPHORE_TOKEN: ${{ secrets.SEMAPHORE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM_EVENT: ${{ github.event.pull_request.number }}
          PROJECT_ID: 7
          TEMPLATE_ID: 145
          MAX_ATTEMPTS: "60"
          POLL_INTERVAL: "10"
        run: |
          SRC_INSTANCE="${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/SCRM_}"
          PR_NUM="${PR_NUM_EVENT:-}"

          PAYLOAD=$(jq -n \
            --argjson tid "${TEMPLATE_ID}" \
            --arg inst "${SRC_INSTANCE}" \
            --arg msg "Commit previo a merge PR #${PR_NUM:-manual}" \
            --arg backups "0" \
            '{
              template_id: $tid,
              message: $msg,
              environment: (
                {
                  instance: $inst,
                  commit_message: $msg,
                  backups_db: $backups
                } | tostring
              )
            }')

          http_call() {
            local method="$1" url="$2" token="$3" data="$4"
            local response
            response=$(curl -s -w "\n%{http_code}" -X "$method" "$url" \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$data")

            HTTP_CODE=$(echo "$response" | tail -n1)
            BODY=$(echo "$response" | sed '$d')
            echo "$HTTP_CODE $BODY"
          }

          post_comment() {
            [ -z "$PR_NUM" ] && { echo "$1"; return 0; }
            new_comment="[ $(date '+%Y-%m-%d %H:%M:%S') ] $1"
            old_comment=$(gh pr view "$PR_NUM" --repo="$GITHUB_REPOSITORY" --json comments --jq '[.comments[] | select(.author.login == "github-actions")][-1].body // ""')
            full_comment=${old_comment:+${old_comment}$'\n\n'}${new_comment}
            gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --create-if-none --edit-last --body "$full_comment" > /dev/null
          }

          message="🚀 Comprobando cambios pendientes en producción (${SRC_INSTANCE})..."
          echo "$message"
          post_comment "$message"

          res=$(http_call "POST" "${SEMAPHORE_URL}/api/project/${PROJECT_ID}/tasks" "$SEMAPHORE_TOKEN" "$PAYLOAD")
          code=$(echo "$res" | cut -d' ' -f1)
          body=$(echo "$res" | cut -d' ' -f2-)

          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::Semaphore rechazó la tarea (HTTP $code). Respuesta: $body"
            post_comment "❌ Error: Semaphore devolvió HTTP $code."
            exit 1
          fi

          TASK_ID=$(echo "$body" | jq -r '.id')
          if [ -z "$TASK_ID" ] || [ "$TASK_ID" == "null" ]; then
            echo "::error::Respuesta inválida de Semaphore: $body"
            exit 1
          fi

          task_link="${SEMAPHORE_URL}/project/${PROJECT_ID}/history?t=${TASK_ID}"
          post_comment "Puedes seguir el commit previo $TASK_ID en [Semaphore]($task_link)"

          attempt=0
          status="running"
          while [[ "$status" == "running" || "$status" == "waiting" ]]; do
            attempt=$((attempt + 1))
            [ $attempt -gt $MAX_ATTEMPTS ] && { echo "::error::Timeout esperando la tarea $TASK_ID"; exit 1; }
            sleep $POLL_INTERVAL

            res=$(http_call "GET" "${SEMAPHORE_URL}/api/project/${PROJECT_ID}/tasks/${TASK_ID}" "$SEMAPHORE_TOKEN" "")
            code=$(echo "$res" | cut -d' ' -f1)
            [ "$code" != "200" ] && { echo "::warning::Error consultando estado (HTTP $code). Reintentando..."; continue; }

            status=$(echo "$res" | cut -d' ' -f2- | jq -r '.status')
            echo "🔍 Comprobando tarea, intento $attempt, estado: $status"
          done

          if [ "$status" == "success" ]; then
            post_comment "✅ **Producción sin cambios pendientes o commit realizado**. Ya se puede mergear. [Semaphore]($task_link)"
            echo "🎉 Check OK. Tarea $TASK_ID completada. Log en $task_link"
          else
            post_comment "❌ **No se pudo commitear la producción**. Resuelve los conflictos en el PR antes de mergear. [Semaphore]($task_link)"
            echo "💥 Check fallido. Tarea $TASK_ID terminó con estado: $status. Log en $task_link"
            exit 1
          fi
